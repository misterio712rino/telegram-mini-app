<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            font-size: 16px;
        }
        button {
            background-color: var(--tg-theme-button-color, #31A8FF);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .code-block {
            background: var(--tg-theme-secondary-bg-color, #eee);
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="greeting">Загрузка...</h2>
        
        <label for="message">Введи сообщение для бота:</label>
        <input type="text" id="message" placeholder="Привет, бот!" maxlength="200">
        
        <button id="send-btn">Отправить данные</button>
        
        <p style="margin-top:20px; font-size:14px;">
            Тема Telegram: <span id="theme-info"></span>
        </p>
        <div class="code-block" id="debug" style="display:none;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const greetingEl = document.getElementById('greeting');
        if (user) {
            greetingEl.textContent = `Привет, ${user.first_name} ${user.last_name || ''}!`;
        } else {
            greetingEl.textContent = 'Привет! (запущено вне Telegram)';
        }

        document.getElementById('theme-info').textContent = 
            `Цвет фона: ${tg.themeParams.bg_color || 'стандартный'}, ` +
            `Цвет текста: ${tg.themeParams.text_color || 'стандартный'}`;

        const mainButton = tg.MainButton;
        mainButton.setText('Отправить данные как главная кнопка');
        mainButton.show();
        mainButton.onClick(() => {
            sendDataToBot();
        });

        document.getElementById('send-btn').addEventListener('click', () => {
            sendDataToBot();
        });

        function sendDataToBot() {
            const message = document.getElementById('message').value.trim();
            if (!message) {
                alert('Введи сообщение!');
                return;
            }
            const data = JSON.stringify({
                text: message,
                from: user?.first_name || 'гость',
                timestamp: Date.now()
            });
            document.getElementById('debug').style.display = 'block';
            document.getElementById('debug').textContent = 'Отправленные данные: ' + data;
            tg.sendData(data);
        }

        tg.onEvent('mainButtonClicked', () => {});
    </script>
</body>
</html>
